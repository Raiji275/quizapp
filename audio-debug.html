<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #cce7ff; color: #004a80; }
    </style>
</head>
<body>
    <h1>Audio Debug Test</h1>
    
    <audio id="audioPlayer" preload="metadata" controls style="width: 100%; margin: 20px 0;"></audio>
    
    <div>
        <button class="btn" onclick="testAudioFile()">Test Audio File</button>
        <button class="btn" onclick="testTTS()">Test Text-to-Speech</button>
        <button class="btn" onclick="clearAudio()">Clear Audio</button>
    </div>
    
    <div id="status" class="status"></div>
    <div id="log" style="background: #f0f0f0; padding: 10px; height: 200px; overflow-y: scroll; font-family: monospace; font-size: 12px;"></div>

    <script>
        function log(message) {
            const logEl = document.getElementById('status');
            const logDiv = document.getElementById('log');
            console.log(message);
            logEl.textContent = message;
            logEl.className = 'status info';
            logDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function showStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            log(message);
        }

        async function testAudioFile() {
            log('Testing audio file...');
            const audio = document.getElementById('audioPlayer');
            
            audio.src = 'audio/listening1.mp3';
            
            audio.onloadstart = () => log('Audio loading started');
            audio.onloadedmetadata = () => {
                log('Audio metadata loaded');
                log('Duration: ' + audio.duration + ' seconds');
            };
            audio.oncanplay = () => {
                log('Audio can play');
                showStatus('Audio ready - attempting to play', 'success');
                audio.play().then(() => {
                    log('Audio playing successfully');
                }).catch(error => {
                    log('Audio play failed: ' + error.message);
                    showStatus('Audio play failed: ' + error.message, 'error');
                });
            };
            audio.onerror = (e) => {
                log('Audio error: ' + e.message);
                showStatus('Audio error occurred', 'error');
            };
            
            audio.load();
        }

        function testTTS() {
            log('Testing text-to-speech...');
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance('This is a test of the text to speech functionality.');
                utterance.onstart = () => log('TTS started');
                utterance.onend = () => log('TTS ended');
                utterance.onerror = (e) => log('TTS error: ' + e.error);
                
                speechSynthesis.speak(utterance);
                showStatus('TTS initiated', 'info');
            } else {
                showStatus('Text-to-speech not supported', 'error');
            }
        }

        function clearAudio() {
            const audio = document.getElementById('audioPlayer');
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            showStatus('Audio cleared', 'info');
        }

        // Initial test
        window.onload = () => {
            log('Page loaded');
            log('Audio element: ' + (document.getElementById('audioPlayer') ? 'Found' : 'Not found'));
            log('Speech synthesis: ' + ('speechSynthesis' in window ? 'Available' : 'Not available'));
        };
    </script>
</body>
</html>
